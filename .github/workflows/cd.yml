
name: Docker Practical - Publish and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-practical-cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-and-deploy:
    name: Build, Publish and Deploy TaskFlow
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Validate Docker Hub secrets
      - name: Validate required secrets
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          test -n "$DOCKERHUB_USERNAME" || exit 1
          test -n "$DOCKERHUB_TOKEN" || exit 1
          test -n "$POSTGRES_PASSWORD" || exit 1
          echo "All required secrets are configured."

      # 3. Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 4. Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 5. Build and publish backend
      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            kunal1sahu/backend:v1
            kunal1sahu/backend:latest

      # 6. Build and publish frontend
      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            kunal1sahu/frontend:v1
            kunal1sahu/frontend:latest

      # 7. Prepare deployment environment
      - name: Create deployment environment
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          {
            echo "POSTGRES_DB=taskflow"
            echo "POSTGRES_USER=taskflow_user"
            echo "POSTGRES_PASSWORD=$POSTGRES_PASSWORD"
            echo "DATABASE_URL=postgresql://taskflow_user:${POSTGRES_PASSWORD}@postgres:5432/taskflow"
            echo "REDIS_URL=redis://redis:6379"
            echo "JWT_SECRET=$(openssl rand -hex 32)"
            echo "PORT=3000"
          } > .env

      # 8. Validate deployment configuration
      - name: Validate deployment Compose
        run: |
          if grep -Eq '^[[:space:]]+build:' docker-compose.deploy.yml; then
            echo "ERROR: Deployment file must use published images."
            exit 1
          fi

          docker compose -f docker-compose.deploy.yml config --quiet
          echo "Deployment configuration is valid."

      # 9. Pull images from Docker Hub
      - name: Pull Docker Hub images
        run: |
          docker compose -f docker-compose.deploy.yml pull

      # 10. Deploy application
      - name: Deploy using Docker Compose
        run: |
          docker compose -f docker-compose.deploy.yml up -d --wait

      # 11. Verify backend
      - name: Verify backend health
        run: |
          curl --fail --retry 10 --retry-delay 5 \
            http://localhost:3000/health

          echo "Backend is responding successfully."

      # 12. Verify frontend
      - name: Verify frontend application
        run: |
          curl --fail --retry 10 --retry-delay 5 \
            http://localhost:8081/

          echo "Frontend is responding successfully."

      # 13. Display running containers
      - name: Verify Docker Compose services
        run: |
          docker compose -f docker-compose.deploy.yml ps

      # 14. Record Docker Hub publication
      - name: Record published images
        run: |
          {
            echo "## Docker Hub Publication"
            echo ""
            echo "| Service | Docker Hub Image |"
            echo "|---|---|"
            echo "| Backend | kunal1sahu/backend:v1 |"
            echo "| Backend | kunal1sahu/backend:latest |"
            echo "| Frontend | kunal1sahu/frontend:v1 |"
            echo "| Frontend | kunal1sahu/frontend:latest |"
            echo ""
            echo "Deployment verification completed successfully."
          } >> "$GITHUB_STEP_SUMMARY"

      # 15. Display deployment logs if a step fails
      - name: Show deployment logs on failure
        if: failure()
        run: |
          docker compose -f docker-compose.deploy.yml ps || true
          docker compose -f docker-compose.deploy.yml logs --no-color || true
